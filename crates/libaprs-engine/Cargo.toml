[package]
name = "libaprs-engine"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Protocol-first APRS engine core primitives"
readme = "../../README.md"
repository = "https://github.com/elodiejmirza/libaprs-engine"
keywords = ["aprs", "packet", "radio", "parser", "protocol"]
categories = ["parser-implementations", "encoding"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[lib]
name = "libaprs_engine"
path = "src/lib.rs"

[[bench]]
name = "parser_throughput"
harness = false
