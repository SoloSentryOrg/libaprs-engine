name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.80.0", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Select Rust
        run: rustup default ${{ matrix.toolchain }}

      - name: Install components
        run: rustup component add clippy rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.lock', 'examples/downstream-smoke/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Format fuzz workspace
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Test
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

      - name: Test examples
        run: cargo test --examples

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Docs
        run: cargo doc --no-deps --all-features

      - name: Package
        run: cargo package -p libaprs-engine

      - name: Downstream smoke
        run: cargo check --manifest-path examples/downstream-smoke/Cargo.toml

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  release-script:
    name: Release script
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.80.0 --profile minimal

      - name: Select Rust
        run: rustup default stable

      - name: Install components
        run: |
          rustup component add clippy rustfmt
          rustup component add clippy --toolchain 1.80.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-script-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.lock', 'examples/downstream-smoke/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-script-

      - name: Install release tools
        timeout-minutes: 12
        run: |
          cargo install cargo-semver-checks --version 0.47.0 --locked --debug
          cargo install cargo-audit --version 0.22.1 --locked --debug
          cargo install cargo-deny --version 0.19.4 --locked --debug

      - name: Test publish guard
        run: scripts/test-publish-release-guards.sh

      - name: Verify release script
        run: scripts/verify-release.sh
