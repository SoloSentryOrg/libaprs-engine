name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.80.0", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Select Rust
        run: rustup default ${{ matrix.toolchain }}

      - name: Install components
        run: rustup component add clippy rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

      - name: Test examples
        run: cargo test --examples

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Docs
        run: cargo doc --no-deps --all-features

      - name: Package
        run: cargo package -p libaprs-engine

      - name: Downstream smoke
        run: cargo check --manifest-path examples/downstream-smoke/Cargo.toml

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
