name: Rust CI

on:
  workflow_dispatch:
    inputs:
      downstream_smoke:
        description: "Run crates.io downstream smoke checks. Enable only after the target crate versions are published."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.80.0", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Select Rust
        run: rustup default ${{ matrix.toolchain }}

      - name: Install components
        run: rustup component add clippy rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag: v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.lock', 'examples/downstream-smoke/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: Cargo cache summary
        if: always()
        run: |
          du -sh ~/.cargo/registry ~/.cargo/git 2>/dev/null || true

      - name: Format
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo fmt --all --check

      - name: Format fuzz workspace
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Test
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

      - name: Test examples
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo test --examples

      - name: Metadata
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo metadata --no-deps --format-version 1

      - name: Docs
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo doc --no-deps --all-features

      - name: Package
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo package -p libaprs-engine

      - name: Downstream smoke
        if: ${{ matrix.toolchain == 'stable' && github.event_name == 'workflow_dispatch' && inputs.downstream_smoke == 'true' }}
        run: cargo check --manifest-path examples/downstream-smoke/Cargo.toml

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  release-script:
    name: Release script
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.80.0 --profile minimal

      - name: Select Rust
        run: rustup default stable

      - name: Install components
        run: |
          rustup component add clippy rustfmt
          rustup component add clippy --toolchain 1.80.0

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag: v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-script-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.lock', 'examples/downstream-smoke/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-script-

      - name: Cargo cache summary
        if: always()
        run: |
          du -sh ~/.cargo/registry ~/.cargo/git 2>/dev/null || true

      - name: Compute advisory cache key
        id: advisory-cache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag: v6
        with:
          path: ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-advisory-release-script-${{ steps.advisory-cache.outputs.week }}-${{ hashFiles('.github/workflows/rust-ci.yml', 'scripts/install-release-tools.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-advisory-release-script-${{ steps.advisory-cache.outputs.week }}-
            ${{ runner.os }}-cargo-advisory-release-script-
            ${{ runner.os }}-cargo-advisory-

      - name: Install release tools
        timeout-minutes: 5
        run: scripts/install-release-tools.sh

      - name: Install SBOM tool
        timeout-minutes: 10
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Test publish guard
        run: scripts/test-publish-release-guards.sh

      - name: Verify release script
        env:
          LIBAPRS_RUN_DOWNSTREAM_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.downstream_smoke == 'true' && '1' || '0' }}
        run: scripts/verify-release.sh
