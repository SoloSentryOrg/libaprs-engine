name: Rust CI

on:
  workflow_dispatch:
    inputs:
      downstream_smoke:
        description: "Run crates.io downstream smoke checks. Enable only after the target crate versions are published."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.80.0", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Select Rust
        run: rustup default ${{ matrix.toolchain }}

      - name: Install components
        run: rustup component add clippy rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.lock', 'examples/downstream-smoke/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Format fuzz workspace
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Test
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

      - name: Test examples
        run: cargo test --examples

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Docs
        run: cargo doc --no-deps --all-features

      - name: Package
        run: cargo package -p libaprs-engine

      - name: Downstream smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.downstream_smoke == 'true' }}
        run: cargo check --manifest-path examples/downstream-smoke/Cargo.toml

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  release-script:
    name: Release script
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.80.0 --profile minimal

      - name: Select Rust
        run: rustup default stable

      - name: Install components
        run: |
          rustup component add clippy rustfmt
          rustup component add clippy --toolchain 1.80.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-script-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.lock', 'examples/downstream-smoke/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-script-

      - name: Install release tools
        timeout-minutes: 5
        run: |
          install_release_tool() {
            name="$1"
            url="$2"
            sha256="$3"
            archive="/tmp/${name}.tar.gz"
            extract_dir="/tmp/${name}"

            curl -LsSf -o "$archive" "$url"
            printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
            mkdir -p "$extract_dir"
            tar -xzf "$archive" -C "$extract_dir"
            find "$extract_dir" -type f -name "$name" -perm /111 -exec cp {} "$HOME/.cargo/bin/$name" \;
            "$HOME/.cargo/bin/$name" --version
          }

          install_release_tool \
            cargo-semver-checks \
            https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.47.0/cargo-semver-checks-x86_64-unknown-linux-musl.tar.gz \
            daea6dfdebf9b15ce902a8af2fc6b9c2e86ddd49af17a9c5a656939289588f68
          install_release_tool \
            cargo-audit \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.1/cargo-audit-x86_64-unknown-linux-musl-v0.22.1.tgz \
            c32506f338bdcdaef5a17fb9f33abb6ecf9561324cfd34237fd335f9283a1eab
          install_release_tool \
            cargo-deny \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.4/cargo-deny-0.19.4-x86_64-unknown-linux-musl.tar.gz \
            3bd58b784e83715b86ddbc9deac591890372ec77fda5741bb0826970b958506f

      - name: Test publish guard
        run: scripts/test-publish-release-guards.sh

      - name: Verify release script
        env:
          LIBAPRS_RUN_DOWNSTREAM_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.downstream_smoke == 'true' && '1' || '0' }}
        run: scripts/verify-release.sh
