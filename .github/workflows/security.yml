name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  cargo-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install security tools
        run: cargo install cargo-audit cargo-deny --locked

      - name: Audit
        run: cargo audit

      - name: Deny
        run: cargo deny check
