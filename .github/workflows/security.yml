name: Security

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "examples/downstream-smoke/Cargo.toml"
      - "examples/downstream-smoke/Cargo.lock"
      - "fuzz/Cargo.toml"
      - "fuzz/Cargo.lock"
      - "deny.toml"
      - "scripts/install-release-tools.sh"
      - ".github/workflows/security.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "examples/downstream-smoke/Cargo.toml"
      - "examples/downstream-smoke/Cargo.lock"
      - "fuzz/Cargo.toml"
      - "fuzz/Cargo.lock"
      - "deny.toml"
      - "scripts/install-release-tools.sh"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-security-

      - name: Compute advisory cache key
        id: advisory-cache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache advisory database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-advisory-${{ steps.advisory-cache.outputs.week }}-${{ hashFiles('.github/workflows/security.yml', 'scripts/install-release-tools.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-advisory-${{ steps.advisory-cache.outputs.week }}-
            ${{ runner.os }}-cargo-advisory-

      - name: Install security tools
        timeout-minutes: 5
        run: |
          scripts/install-release-tools.sh cargo-audit cargo-deny

      - name: Audit
        run: cargo audit

      - name: Deny
        run: cargo deny check
